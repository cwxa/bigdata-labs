name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只读代码，不需要写回任何东西
permissions:
  contents: read

# 同一分支的新提交会取消上一次运行，避免排队浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: pip install ruff
      - name: ruff check（口径见 pyproject.toml）
        run: ruff check . --output-format=concise

  test:
    name: 单元测试 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一个版本失败不掩盖其他版本的结果
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt

      # 两套测试都不依赖数据集缓存与绘图后端，因此在无头容器里结果确定
      - name: 实验二 · Apriori / FP-growth（23 例）
        working-directory: lab2-association-rules/code
        run: python -m unittest test_apriori test_fp_growth -v

      - name: 实验一 · PCA 数学性质（11 例）
        working-directory: lab1-pca-face-reconstruction
        run: python -m unittest test_pca -v

      - name: 脚本可编译性（防止语法级回归）
        run: |
          python -m py_compile \
            lab1-pca-face-reconstruction/pca_face_reconstruction.py \
            lab1-pca-face-reconstruction/pca_face_reconstruction_en.py \
            lab1-pca-face-reconstruction/paper/build.py \
            lab1-pca-face-reconstruction/paper/make_figs.py \
            lab1-pca-face-reconstruction/paper/extra_exp.py \
            lab2-association-rules/code/apriori.py \
            lab2-association-rules/code/fp_growth.py \
            lab2-association-rules/code/run_experiments.py \
            lab2-association-rules/code/analyze_rule_robustness.py \
            lab2-association-rules/paper/build.py \
            lab2-association-rules/paper/make_numbers.py \
            lab2-association-rules/paper/make_tables.py \
            lab2-association-rules/paper/make_figs_en.py
